version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # NENHUMA variavel de ambiente e exportada aqui, de proposito.
        #
        # O frontend nao conhece URL de Supabase, anon key nem clientId do Azure:
        # ele chama o caminho relativo /api/<funcao>, e quem traduz isso para as
        # Edge Functions e a regra de rewrite da hospedagem (ver abaixo). O
        # clientId e o tenantId chegam em tempo de execucao, pela funcao publica
        # app-config, que le a tabela carbon_app_config.
        #
        # Nada que identifique o projeto entra no bundle. Conferir depois do
        # build, no PowerShell:
        #   Select-String -Path dist\assets\*.js -Pattern "supabase.co" -SimpleMatch
        # Nao pode devolver nada.
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

# A ORDEM IMPORTA. O Amplify avalia as regras de cima para baixo e para na
# primeira que casar. Se o catch-all da SPA viesse antes, ele engoliria /api/* e
# devolveria o index.html no lugar da resposta da funcao - e o sintoma seria
# "a configuracao do aplicativo retornou um corpo que nao e JSON", culpando a
# Edge Function por um problema de hospedagem.
#
# A REGRA DE /api NAO ESTA AQUI, e a ausencia e deliberada: o destino contem o
# ref do projeto Supabase, e deixa-lo no repositorio significaria versionar qual
# projeto e o de producao - exatamente o que a arquitetura /api existe para
# evitar (ver src/lib/endpoint.js). Ela e configurada no console:
#
#   App settings > Rewrites and redirects > Add rule
#
#   source  /api/<*>
#   target  https://<REF>.supabase.co/functions/v1/<*>
#   type    200 (Rewrite)
#
# E ela precisa vir ANTES do catch-all abaixo, na lista do console.
#
# EQUIVALENTE EM DESENVOLVIMENTO: o server.proxy do vite.config.js, alimentado
# por SUPABASE_FUNCTIONS_URL - sem prefixo VITE_, para o Vite se recusar a expor
# a variavel ao navegador.
#
# SE HOUVER CLOUDFLARE NA FRENTE: a regra continua sendo do Amplify, que e quem
# serve o site. O que a Cloudflare precisa e NAO atrapalhar - /api/* nao pode
# ser cacheado (as respostas sao por sessao e por usuario) e o cabecalho
# Authorization tem que passar intacto. Uma regra de cache padrao que ignore
# query string ou remova cabecalho quebraria a autenticacao de forma
# intermitente, que e o pior modo de quebrar.
customRules:
  - source: /<*>
    target: /index.html
    status: '200'

# TENTATIVA de esconder de qual projeto Supabase as respostas vem.
#
# O QUE VAZA HOJE: o gateway do Supabase carimba `sb-project-ref` em TODA
# resposta, e o rewrite repassa. O ref nao esta no bundle nem na barra de
# endereco, mas aparece na aba Network do DevTools em qualquer requisicao -
# medido em 25/08/2026.
#
# ISTO PODE NAO FUNCIONAR. `customHeaders` e documentado para o conteudo que o
# proprio Amplify serve; se ele sobrescreve cabecalho vindo de um rewrite de
# proxy, a documentacao nao diz. Conferir DEPOIS do deploy, com:
#
#   curl.exe -s -D - -o NUL https://<dominio>/api/app-config | Select-String "sb-"
#
# Sem saida: funcionou. Ainda mostrando sb-project-ref: nao funcionou, e o
# lugar certo passa a ser uma Transform Rule de resposta na Cloudflare.
#
# NAO REMOVER sb-request-id NEM x-deno-execution-id SEM PENSAR: sao eles que
# ligam um erro relatado pelo cliente ao log da funcao no painel do Supabase.
# Escondendo os dois, "me manda o id do erro" deixa de existir como caminho de
# suporte. Estao aqui porque tambem identificam o Supabase, mas a troca e real.
#
# E VALE LEMBRAR O QUE ISTO NAO E: esconder a URL nao e o que protege o sistema.
# Quem defende as funcoes e a autenticacao dentro delas - ID token do Azure
# validado contra o JWKS da Microsoft no carbon-api, token de sessao HMAC no
# Secure Share. Isto aqui e defesa em profundidade: obriga o trafego a passar
# pelo nosso dominio, onde ha log e limite de taxa.
customHeaders:
  # CABECALHOS DE SEGURANCA DO SITE INTEIRO.
  #
  # Estes existem porque NAO dao para ser entregues pelo <meta> do index.html:
  # a especificacao manda ignorar frame-ancestors quando a politica chega por
  # meta, e X-Frame-Options nunca funcionou por meta. Escrever a diretiva la
  # daria impressao de protecao sem proteger nada, que e pior do que a ausencia.
  # A CSP principal continua no index.html, onde e versionada junto com o que
  # ela descreve; aqui fica so o que exige cabecalho de verdade.
  - pattern: '/<*>'
    headers:
      # Clickjacking: impede que o Portal seja embutido em iframe de terceiro,
      # onde um atacante sobrepoe a interface e captura cliques autenticados.
      # Os dois juntos de proposito: X-Frame-Options para navegador antigo,
      # frame-ancestors para o resto.
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'Content-Security-Policy'
        value: "frame-ancestors 'none'"
      # Impede o navegador de adivinhar o tipo do conteudo e executar como script
      # algo servido como texto.
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      # O caminho da URL do Portal carrega id de projeto e de registro. Com a
      # politica padrao, esse caminho viaja no Referer para todo site externo que
      # alguem abrir a partir daqui.
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      # Nenhuma tela do Portal usa camera, microfone ou geolocalizacao. Negar por
      # padrao evita que um script injetado peca permissao em nome do dominio.
      - key: 'Permissions-Policy'
        value: 'camera=(), microphone=(), geolocation=(), payment=()'

  - pattern: '/api/<*>'
    headers:
      - key: 'sb-project-ref'
        value: ''
      - key: 'sb-request-id'
        value: ''
      - key: 'sb-gateway-version'
        value: ''
      - key: 'x-served-by'
        value: ''
      - key: 'x-sb-edge-region'
        value: ''
      - key: 'x-deno-execution-id'
        value: ''
