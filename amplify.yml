version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # NENHUMA variavel de ambiente e exportada aqui, de proposito.
        #
        # O frontend nao conhece URL de Supabase, anon key nem clientId do Azure:
        # ele chama o caminho relativo /api/<funcao>, e quem traduz isso para as
        # Edge Functions e a regra de rewrite da hospedagem (ver abaixo). O
        # clientId e o tenantId chegam em tempo de execucao, pela funcao publica
        # app-config, que le a tabela carbon_app_config.
        #
        # Nada que identifique o projeto entra no bundle. Conferir depois do
        # build, no PowerShell:
        #
        #   Select-String -Path dist\assets\*.js -Pattern "[a-z]{20}\.supabase\.co"
        #
        # Nao pode devolver nada.
        #
        # O PADRAO E ESSE, e nao "supabase.co" simples, porque a busca simples da
        # FALSO POSITIVO: a mensagem de erro do ConfigErrorScreen ensina a montar
        # o rewrite e cita "https://SEU-PROJETO.supabase.co/functions/v1/<*>"
        # como exemplo. Esse texto esta no bundle de proposito.
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

# =============================================================================
# ESTE ARQUIVO NAO CONFIGURA REWRITE NEM CABECALHO. Ele so descreve o build.
#
# Ate 02/09/2026 havia aqui um bloco `customRules` e um `customHeaders`, e os
# dois eram SILENCIOSAMENTE IGNORADOS pelo Amplify. O custo apareceu no primeiro
# dia de producao: /api/app-config devolvia 404 e todo link direto da SPA
# (/PrestacaoContas, por exemplo) devolvia 404 tambem, porque nem o proxy de
# /api nem o catch-all da SPA existiam de fato. Os cabecalhos de seguranca
# tambem nao chegavam ao navegador - conferido numa resposta real.
#
# ONDE CADA COISA MORA, de verdade:
#
#   CABECALHOS  -> customHttp.yml, na raiz deste repositorio.
#                  A AWS recomenda explicitamente migrar para fora do
#                  amplify.yml quem os tinha aqui.
#                  https://docs.aws.amazon.com/amplify/latest/userguide/custom-headers.html
#
#   REWRITE E REDIRECT -> SOMENTE no console. Nao existe arquivo para isso:
#                  "Amplify supports the following redirect types in the
#                  console." Nao adianta _redirects, nem netlify.toml, nem
#                  customRules aqui.
#                  https://docs.aws.amazon.com/amplify/latest/userguide/redirects.html
#
# -----------------------------------------------------------------------------
# AS DUAS REGRAS QUE PRECISAM EXISTIR NO CONSOLE
# App settings > Rewrites and redirects, NESTA ORDEM
# -----------------------------------------------------------------------------
#   1)  source  /api/<*>
#       target  https://<REF>.supabase.co/functions/v1/<*>
#       type    200 (Rewrite)
#
#   2)  source  /<*>
#       target  /index.html
#       type    200 (Rewrite)
#
# A ORDEM IMPORTA e o Amplify avalia de cima para baixo, parando na primeira que
# casa. Com o catch-all em cima, ele engole /api/* e devolve index.html no lugar
# da resposta da funcao - e o sintoma e "a configuracao retornou um corpo que
# nao e JSON", culpando a Edge Function por um problema de hospedagem.
#
# A SINTAXE DO CURINGA E <*>, com os sinais de maior e menor. Escrever /api/*
# nao casa com nada, e o efeito e identico a nao ter regra: 404.
#
# SEM A REGRA 2, todo link direto da SPA da 404. A raiz funciona porque
# index.html e o documento padrao; qualquer outro caminho nao existe como
# arquivo. Foi o que aconteceu com /PrestacaoContas em 02/09/2026.
#
# O DESTINO DA REGRA 1 NAO ESTA NESTE ARQUIVO de proposito: ele contem o ref do
# projeto Supabase, e versionar isso significaria gravar no repositorio qual
# projeto e o de producao - exatamente o que a arquitetura /api existe para
# evitar (ver src/lib/endpoint.js).
#
# -----------------------------------------------------------------------------
# COM CLOUDFLARE NA FRENTE (e o caso hoje: as respostas vem com cf-ray e a
# origem e CloudFront/Amplify)
# -----------------------------------------------------------------------------
# A regra continua sendo do Amplify, que e quem serve. O que a Cloudflare
# precisa e NAO atrapalhar:
#
#   - /api/* nao pode ser cacheado. As respostas sao por sessao e por usuario, e
#     uma regra de cache padrao pode servir a resposta de uma pessoa para outra.
#     Cache Rules > Bypass cache para o caminho /api/*.
#   - O cabecalho Authorization tem que passar intacto.
#   - SSL/TLS em Full (strict). "Flexible" com origem que forca HTTPS produz
#     laco de redirecionamento.
#   - Web Analytics (Browser Insights) INJETA um script inline mais o
#     static.cloudflareinsights.com/beacon.min.js na resposta. A CSP do
#     index.html usa script-src 'self' e bloqueia os dois, o que enche o console
#     de erro. Desligar o Web Analytics resolve sem afrouxar a CSP; a alternativa
#     seria permitir o dominio e um hash inline que muda a cada versao do beacon.
# =============================================================================
